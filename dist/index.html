  <body>
    <div id="root">
      <div id="cpro-boot-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b1120; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: cpro-spin 0.9s linear infinite; margin-bottom: 20px;"></div>
        <div style="font-size: 19px; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 6px; color: #ffffff;">Karsa Cloud <span style="color: #f59e0b;">PRO</span></div>
        <div id="boot-status-hint" style="font-size: 13px; color: #94a3b8; max-width: 360px; line-height: 1.5; margin-bottom: 20px;">Menyinkronkan panel hosting &amp; aset Karsa Cloud PRO...</div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
          <button type="button" onclick="window.cleanCacheAndReload && window.cleanCacheAndReload()" style="background: #0284c7; color: #ffffff; border: none; padding: 12px 24px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);">Muat Ulang Versi Terbaru (Refresh)</button>
        </div>
        <style>@keyframes cpro-spin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script>
      (function() {
        try {
          var k = 'cloudpro_database_v6';
          var raw = localStorage.getItem(k);
          if (raw && (raw.indexOf('Karsa Cloud Root System') !== -1 || raw.indexOf('Root Administrator') !== -1 || raw.indexOf('acc-own-usr-reseller-denbaguse') !== -1)) {
            var patched = raw
              .replace(/"customerName"\s*:\s*"Karsa Cloud Root System"/g, '"customerName":"Jaenal Maskun"')
              .replace(/"name"\s*:\s*"Root Administrator"/g, '"name":"Jaenal Maskun"');
            try {
              var obj = JSON.parse(patched);
              if (Array.isArray(obj.hostingAccounts)) {
                var clean = [];
                var seenDen = false;
                for (var i = 0; i < obj.hostingAccounts.length; i++) {
                  var a = obj.hostingAccounts[i];
                  if (!a) continue;
                  if (a.id === 'acc-own-usr-reseller-denbaguse') continue;
                  if (a.primaryDomain === 'denbaguse.my.id' || a.id === 'acc-denbaguse-01') {
                    if (seenDen) continue;
                    seenDen = true;
                    a.customerName = 'Den Baguse';
                  }
                  if (a.id === 'acc-rdm-01') {
                    if (!a.customerName || a.customerName === 'Karsa Cloud Root System' || a.customerName === 'cloudpro') a.customerName = 'Jaenal Maskun';
                  } else if (a.customerName === 'Jaenal Maskun') {
                    a.customerName = (a.primaryDomain === 'denbaguse.my.id') ? 'Den Baguse' : 'Pelanggan Hosting cPanel';
                  }
                  clean.push(a);
                }
                obj.hostingAccounts = clean;
              }
              if (Array.isArray(obj.users)) {
                for (var j = 0; j < obj.users.length; j++) {
                  var u = obj.users[j];
                  if (u && (u.id === 'usr-admin-01' || u.role === 'admin')) {
                    if (!u.name || u.name === 'Root Administrator') u.name = 'Jaenal Maskun';
                  }
                }
              }
              localStorage.setItem(k, JSON.stringify(obj));
            } catch(e) {
              localStorage.setItem(k, patched);
            }
          }
        } catch(e) {}
      })();
    </script>
    <script>
      (function() {
        window.cleanCacheAndReload = function() {
          try {
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) { caches.delete(name); });
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
          } catch(e) {}
          window.location.replace(window.location.origin + window.location.pathname + '?_fresh=' + Date.now());
        };
        window.addEventListener('error', function(e) {
          console.error('[Karsa Cloud Boot Anomaly]', e);
          var hint = document.getElementById('boot-status-hint');
          if (hint) {
            hint.innerHTML = '<span style="color:#fb7185;font-weight:600;">Memperbarui cache browser ke versi terbaru...</span>';
          }
          var msg = (e && e.message) ? String(e.message) : '';
          if (msg.indexOf('Failed to resolve') !== -1 || msg.indexOf('otpauth') !== -1 || msg.indexOf('import') !== -1) {
            setTimeout(function() {
              window.cleanCacheAndReload();
            }, 500);
          }
        });
        setTimeout(function() {
          var rootEl = document.getElementById('root');
          var fallbackMarker = document.getElementById('cpro-boot-loader');
          if (fallbackMarker && rootEl && rootEl.contains(fallbackMarker)) {
            var hint = document.getElementById('boot-status-hint');
            if (hint) {
              hint.innerHTML = 'Browser sedang menyelaraskan aset terbaru. Klik tombol untuk memuat ulang:';
            }
          }
        }, 3000);
      })();
    </script>
  </body>
